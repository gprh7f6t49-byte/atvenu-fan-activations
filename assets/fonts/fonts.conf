<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts for server-rendered wallet artwork. Hosting containers often ship without any fonts,
     so the app brings its own (Inter, DejaVu Sans) and still uses system fonts where present. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
